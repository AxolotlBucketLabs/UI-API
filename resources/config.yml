# nk-ui configuration. Restart the server after editing.
#
# Each module is independent. A disabled module registers no listeners, and
# NkUi::forms(), sidebars() or bossBars() throws ModuleDisabledException for it.
# The form classes (SimpleForm, ModalForm, CustomForm) are plain PocketMine forms
# and keep working without the form module.
modules:
  forms: true
  sidebar: true
  bossbar: true
